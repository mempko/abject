<!doctype html>
<!--
  The social card (public/og-card.png, 1200x630): a Red Sigil poster.
  Render it with `node tools/render-og.mjs` from the site/ directory.
  Pass a screenshot path to set it in the frame on the right, e.g.
  `node tools/render-og.mjs public/gallery/desktop.webp`; without one the
  frame shows drawn windows.
-->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #06070a; overflow: hidden; }
  body { position: relative; font-family: 'PT Sans', sans-serif; color: #e7e1ce; }
  .grid { position: absolute; inset: 0; background-image:
    linear-gradient(rgba(231,225,206,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(231,225,206,0.03) 1px, transparent 1px);
    background-size: 64px 64px; }
  .eclipse { position: absolute; width: 620px; height: 620px; right: -150px; top: -210px; border-radius: 50%;
    background: rgba(211,47,34,0.12); }
  .corona { position: absolute; width: 660px; height: 660px; right: -170px; top: -230px; border-radius: 50%;
    border: 2px solid rgba(91,229,160,0.22); border-left-color: transparent; transform: rotate(18deg); }
  .bar { position: absolute; left: -200px; right: -200px; top: 430px; height: 70px; background: rgba(231,225,206,0.035);
    transform: rotate(-12deg); }
  .wedge { position: absolute; left: 0; bottom: 0; width: 0; height: 0;
    border-bottom: 120px solid rgba(211,47,34,0.5); border-right: 420px solid transparent; }
  .topband { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: #d32f22; }
  .left { position: absolute; left: 64px; top: 64px; width: 600px; }
  .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .eye { width: 54px; height: 54px; border: 6px solid #d32f22; border-radius: 50%; position: relative; }
  .eye::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 26px; border-radius: 50%;
    transform: translate(-50%,-50%); background: #5be5a0; box-shadow: 0 0 14px rgba(91,229,160,0.6); }
  .word { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 0.08em; text-transform: uppercase; }
  .tld { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #8f8a7b; margin-left: -8px; align-self: flex-end; padding-bottom: 8px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; line-height: 0.98; font-size: 74px; color: #f3ecd8; }
  h1 .red { display: inline-block; background: #d32f22; color: #f6efdb; padding: 0 14px; margin-left: -14px; box-shadow: 8px 8px 0 #000; }
  p { margin-top: 26px; font-size: 23px; line-height: 1.38; color: #c7c1ae; max-width: 560px; }
  .meta { position: absolute; left: 64px; bottom: 40px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #8f8a7b;
    display: flex; gap: 22px; align-items: center; }
  .live { width: 10px; height: 10px; background: #5be5a0; box-shadow: 0 0 10px rgba(91,229,160,0.7); }
  .frame { position: absolute; right: 60px; top: 132px; width: 440px; height: 340px; background: #101115;
    border: 2px solid #8d8778; box-shadow: 10px 10px 0 #d32f22; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .w { position: absolute; background: #101115; border: 2px solid #8d8778; box-shadow: 6px 6px 0 #000; }
  .w .b { height: 22px; background: #191a1f; border-bottom: 1px solid rgba(231,225,206,0.14); }
  .w.f { box-shadow: 6px 6px 0 #d32f22; }
  .w.f .b { background: #d32f22; }
  .rows { padding: 12px; display: grid; gap: 8px; }
  .rows i { display: block; height: 7px; background: rgba(231,225,206,0.18); }
  .rows i.g { background: rgba(91,229,160,0.55); width: 40%; }
  .orb { position: absolute; width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3d0, #c9a45c 45%, #6b4f1e 100%); box-shadow: 0 0 30px rgba(201,164,92,0.35); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="eclipse"></div>
  <div class="corona"></div>
  <div class="bar"></div>
  <div class="wedge"></div>
  <div class="topband"></div>
  <div class="left">
    <div class="mark"><div class="eye"></div><span class="word">Abject</span><span class="tld">.world</span></div>
    <h1>An <span class="red">Abject&#8209;Oriented</span><br />OS</h1>
    <p>Describe what you want. An abject appears, window and all, and keeps working after you stop talking to it.</p>
  </div>
  <div class="frame" id="frame">
    <div class="w" style="left:26px;top:30px;width:230px;height:170px"><div class="b"></div><div class="rows"><i></i><i></i><i class="g"></i><i></i></div></div>
    <div class="w f" style="left:150px;top:120px;width:250px;height:180px"><div class="b"></div><div class="rows"><i></i><i></i><i></i><i class="g"></i></div></div>
    <div class="orb" style="left:300px;top:38px"></div>
  </div>
  <div class="meta"><span class="live"></span><span>free · open source · local first · peer to peer</span></div>
  <script>
    const shot = new URLSearchParams(location.search).get('shot');
    if (shot) document.getElementById('frame').innerHTML = `<img src="${shot}" alt="" />`;
  </script>
</body>
</html>
