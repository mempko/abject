appId: world.abject.app
productName: Abject
copyright: Copyright © 2024-2026

afterPack: electron/afterPack.cjs

# Where the app's updater looks for new versions (written into the app as
# resources/app-update.yml). CI builds with --publish never: the release job
# uploads the assets, including latest*.yml and the .blockmap files.
publish:
  provider: github
  owner: mempko
  repo: abject

directories:
  output: release

files:
  - dist-electron/**/*
  - dist-server/**/*
  - dist-client/**/*
  - node_modules/node-datachannel/**/*
  # The pseudo-terminal for the CLI-agent providers. External to the server
  # bundle: it loads its platform package (@lydell/node-pty-<os>-<arch>) by
  # name at runtime.
  - node_modules/@lydell/**/*
  # The terminal emulator. External to the server bundle because its Node
  # loader reads wasm/ghostty-vt.wasm from beside its own module with
  # fs.readFile; the one prebuilt wasm serves every OS and architecture.
  - node_modules/@slopus/**/*
  - node_modules/ws/**/*
  - node_modules/uuid/**/*
  - node_modules/ajv/**/*
  - node_modules/yaml/**/*
  - package.json

# Bundled native (WASM) system packages, ingested at boot from
# resources/native (see src/sandbox/extensions.ts findBuiltinNativeDir).
# Shipped as real files, not inside asar: worker threads read the module
# bytes from disk after the boot ingest copies them into the data dir.
extraResources:
  - from: native
    to: native
    filter:
      - "**/abject.json"
      - "**/*.wasm"
      # Package docs, including the ask guide a package names in abject.json.
      - "**/*.md"
  # The `abject` command, run on the app's own binary as Node by the launcher
  # electron/afterPack.cjs writes beside it (see electron/cli-command.ts).
  - from: dist-cli/abject.mjs
    to: cli/abject.mjs

# Workers and native .node binaries must be unpacked from asar
# (worker_threads and dlopen cannot load from inside asar archives)
asarUnpack:
  - dist-server/workers/**/*
  - node_modules/node-datachannel/**/*.node
  - node_modules/node-datachannel/**/prebuilds/**/*
  # node-pty's addon, and on macOS its spawn-helper executable
  - node_modules/@lydell/**/*
  # The terminal's wasm is read with fs.readFile from a worker thread, which
  # cannot reach inside the asar archive (same reason as the workers below).
  - node_modules/@slopus/**/*

linux:
  target:
    - AppImage
    - deb
  category: Utility

win:
  target:
    - nsis

mac:
  # Both architectures from the one arm64 runner. electron-builder fetches
  # the matching Electron and rebuilds native deps (node-datachannel ships
  # napi prebuilds for darwin-x64). No separate browser ships for either:
  # WebBrowser drives Electron's own Chromium. Default artifact names keep
  # the x64 build unsuffixed (Abject-<v>.dmg) and mark arm64 explicitly.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities

nsis:
  # No spaces: latest.yml records this name, and GitHub turns spaces in an
  # uploaded file's name into dots, so the default "Abject Setup X.exe" could
  # not be found by the updater.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
