appId: world.abject.app
productName: Abject
copyright: Copyright © 2024-2026

afterPack: electron/afterPack.cjs

directories:
  output: release

files:
  - dist-electron/**/*
  - dist-server/**/*
  - dist-client/**/*
  - node_modules/node-datachannel/**/*
  - node_modules/ws/**/*
  - node_modules/uuid/**/*
  - node_modules/ajv/**/*
  - node_modules/yaml/**/*
  - playwright-browsers/**/*
  - package.json

# Bundled native (WASM) system packages, ingested at boot from
# resources/native (see src/sandbox/extensions.ts findBuiltinNativeDir).
# Shipped as real files, not inside asar: worker threads read the module
# bytes from disk after the boot ingest copies them into the data dir.
extraResources:
  - from: native
    to: native
    filter:
      - "**/abject.json"
      - "**/*.wasm"

# Workers and native .node binaries must be unpacked from asar
# (worker_threads and dlopen cannot load from inside asar archives)
asarUnpack:
  - dist-server/workers/**/*
  - node_modules/node-datachannel/**/*.node
  - node_modules/node-datachannel/**/prebuilds/**/*
  - playwright-browsers/**/*

linux:
  target:
    - AppImage
    - deb
  category: Utility

win:
  target:
    - nsis

mac:
  # Both architectures from the one arm64 runner. electron-builder fetches
  # the matching Electron and rebuilds native deps (node-datachannel ships
  # napi prebuilds for darwin-x64); incarnate:mac already downloads the
  # mac-x64 and mac-arm64 Playwright shells. Default artifact names keep
  # the x64 build unsuffixed (Abject-<v>.dmg) and mark arm64 explicitly.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
